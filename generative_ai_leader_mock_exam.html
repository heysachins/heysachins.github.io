let activeSessionQuestions = [];
let currentIdx = 0;
let userAnswers = {};
let scoreCorrect = 0;

function initNewSession() {
    let shuffled = [...masterPool].sort(() => 0.5 - Math.random());
    activeSessionQuestions = shuffled.slice(0, 50);
    currentIdx = 0;
    userAnswers = {};
    scoreCorrect = 0;
    buildJumpGrid();
    renderQuestion();
}

function buildJumpGrid() {
    const grid = document.getElementById("jump-grid");
    if(!grid) return;
    grid.innerHTML = "";
    activeSessionQuestions.forEach((q, idx) => {
        const btn = document.createElement("div");
        btn.className = "jump-btn";
        if (idx === currentIdx) btn.classList.add("current");
        if (userAnswers[q.id]) btn.classList.add("answered");
        btn.textContent = idx + 1;
        btn.onclick = () => {
            currentIdx = idx;
            renderQuestion();
        };
        grid.appendChild(btn);
    });
}

function renderQuestion() {
    if(!activeSessionQuestions.length) return;
    const q = activeSessionQuestions[currentIdx];
    
    const numEl = document.getElementById("q-number");
    if(numEl) numEl.textContent = "Question " + (currentIdx + 1) + " of 50 (ID: #" + q.id + ")";
    
    const textEl = document.getElementById("q-text");
    if(textEl) textEl.textContent = q.question;
    
    const optionsContainer = document.getElementById("options-container");
    if(!optionsContainer) return;
    optionsContainer.innerHTML = "";
    
    const expBox = document.getElementById("explanation-box");
    if(expBox) {
        expBox.style.display = "none";
        expBox.innerHTML = "<strong>Explanation:</strong> " + q.explanation;
    }

    const alreadyAnswered = userAnswers[q.id];

    Object.entries(q.options).forEach(([key, text]) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = text;
        
        if (alreadyAnswered) {
            btn.disabled = true;
            if (key === q.answer) btn.classList.add("correct");
            if (key === alreadyAnswered && key !== q.answer) btn.classList.add("wrong");
            if(expBox) expBox.style.display = "block";
        } else {
            btn.onclick = () => selectOption(key);
        }
        optionsContainer.appendChild(btn);
    });

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    if(prevBtn) prevBtn.disabled = currentIdx === 0;
    if(nextBtn) nextBtn.disabled = currentIdx === activeSessionQuestions.length - 1;
    
    updateScorecard();
    buildJumpGrid();
}

function selectOption(selectedKey) {
    const q = activeSessionQuestions[currentIdx];
    userAnswers[q.id] = selectedKey;
    if (selectedKey === q.answer) {
        scoreCorrect++;
    }
    renderQuestion();
}

function nextQuestion() {
    if (currentIdx < activeSessionQuestions.length - 1) {
        currentIdx++;
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
    }
}

function updateScorecard() {
    const answeredCount = Object.keys(userAnswers).length;
    const sc = document.getElementById("score-correct");
    const sa = document.getElementById("score-answered");
    const acc = document.getElementById("score-accuracy");
    
    if(sc) sc.textContent = scoreCorrect;
    if(sa) sa.textContent = answeredCount + " / 50";
    const accuracy = answeredCount > 0 ? Math.round((scoreCorrect / answeredCount) * 100) : 0;
    if(acc) acc.textContent = accuracy + "%";
}

function resetAndShuffle() {
    if(confirm("Generate a fresh random 50-question test session?")) {
        initNewSession();
    }
}

window.onload = function() {
    initNewSession();
};
