        options: {

es. This ensures grounding in trusted content, reduces hallucinations, and allows for easy updates to the knowledge base without retraining the entire model.<br><br>❌ Option D: Prompt Tuning. Prompt tuning is a parameter-efficient method to adapt a pre-trained LLM to specific tasks or styles. However, it cannot introduce new factual knowledge that was not present in the original LLM's training data. It helps with how the model responds but does not enable it to access or incorporate information from external, private, and up-to-date sources like the firm's proprietary database.<br><br>Key Takeaways<br><br>For AI applications requiring responses grounded in specific, private, and frequently updated external knowledge bases, Retrieval Augmented Generation (RAG) is the most effective and practical solution. It leverages the generative capabilities of large language models while ensuring factual accuracy and reducing hallucinations by providing real-time access to relevant information.<br><br>C. RAG APIs"

d analyzing logs. While security-related events are logged here, Cloud Logging itself does not provide a pre-built, centralized dashboard for identifying vulnerabilities like misconfigured storage buckets or IAM roles. It provides the raw data, not the analysis and vulnerability reporting dashboard.<br><br>Key Takeaways<br><br>For centralized security and risk management, including vulnerability detection and a unified dashboard across Google Cloud resources, Security Command Center is the primary tool. It integrates various security findings and provides a holistic view of an organization's security posture.<br><br>C. Security Command Center"

irements. CCaaS solutions are purpose-built, cloud-native platforms that integrate telephony, IVR, virtual agents, and agent assistance tools into a single, scalable, and enterprise-grade offering, making it the best fit for the described scenario.<br><br>Key Takeaways<br><br>For a comprehensive, end-to-end, and integrated solution for contact centers that includes telephony, IVR, virtual agents, and agent assistance, a Contact Center as a Service (CCaaS) offering is the most suitable choice. Individual AI APIs or specific AI agent builders are components, not complete platforms, and general communication tools like Google Meet do not offer the specialized features required for a modern contact center.<br><br>D. Google Cloud Contact Center as a Service (CCaaS)"

g the temperature parameter would lead to more diverse and less predictable outputs, which would likely result in less consistent output lengths, exacerbating the problem rather than solving it. This parameter is used to control creativity, not consistency in formatting.<br><br>Key Takeaways<br><br>To achieve formatting consistency, especially regarding output length in AI-generated text, it is crucial to guide the model with clear examples or explicit constraints. Few-shot prompting is a powerful technique for teaching AI models desired output characteristics, including length and style, by providing a few high-quality examples. While setting maximum length limits can prevent over-length issues, few-shot prompting offers a more comprehensive solution by addressing both minimum and maximum length requirements through learned patterns.<br><br>B. Using few-shot prompting with multiple product examples"

ment focuses on the unusual financial characteristics themselves (e.g., different credit profiles, unique collateral types) rather than explicitly mentioning demographic groups or unfair treatment based on them. The core issue described is the model's inability to handle atypical financial structures, not discriminatory outcomes based on identity.<br><br>✅ Option C: Edge cases where unusual scenarios exceed the model's typical training experience<br><br>This option accurately describes the limitation. The \"unusual situations\" mentioned (significantly different credit profiles, international income sources, unique collateral types) are precisely what constitute edge cases. These are scenarios that deviate significantly from the \"standard applications\" the model was likely trained on. The AI performs poorly because these scenarios fall outside the scope of its typical training data and learned patterns.<br><br>❌ Option D: Hallucination causing the AI to generate incorrect financial information<br><br>Hallucination typically refers to an AI (especially generative models) producing factually incorrect, nonsensical, or fabricated outputs with high confidence. The problem states the system \"fails when encountering unusual situations.\" This implies an inability to process or correctly evaluate these situations, leading to a breakdown in the application process, rather than the AI actively generating false financial data or making things up. While a failure might indirectly lead to incorrect outcomes, the primary limitation described is the inability to handle the unusual input, not the generation of fabricated output.<br><br>Key Takeaways<br><br>Edge Cases: These are rare or extreme scenarios that fall outside the typical data distribution an AI model was trained on. Models often perform poorly when encountering edge cases because they haven't learned how to handle such variations.<br><br>Model Robustness: To improve robustness, AI models need to be trained on diverse datasets that include a wide range of scenarios, including edge cases, or employ techniques like anomaly detection and human-in-the-loop systems for unusual inputs.<br><br>Limitations of Training Data: The performance of an AI system is heavily dependent on the quality and comprehensiveness of its training data. Gaps in training data, particularly regarding unusual scenarios, can lead to significant limitations in real-world application.<br><br>C. Edge cases where unusual scenarios exceed the model's typical training experience"

ta. Training a custom model is resource-intensive, and more importantly, using \"public business data\" still means using general internet information, not the firm's proprietary internal documents. This fails to meet the core requirement of using only their specific, private data.<br><br>Key Takeaways<br><br>To ensure an AI assistant uses only specific, proprietary information and avoids general internet data, a retrieval-augmented generation (RAG) approach, where the AI queries a dedicated internal document repository, is the most effective solution. This method grounds the AI's responses in authoritative, internal sources.<br><br>C. Implementing retrieval from the company's specific document repository"

let activeSessionQuestions = [];
let currentIdx = 0;
let userAnswers = {};
let scoreCorrect = 0;

function initNewSession() {
    let shuffled = [...masterPool].sort(() => 0.5 - Math.random());
    // The source PDF repeats a few questions; never show the same question twice in one session.
    const seenQuestions = new Set();
    activeSessionQuestions = shuffled.filter(q => {
        if (seenQuestions.has(q.question)) return false;
        seenQuestions.add(q.question);
        return true;
    }).slice(0, 50);
    currentIdx = 0;
    userAnswers = {};
    scoreCorrect = 0;
    buildJumpGrid();
    renderQuestion();
}

function buildJumpGrid() {
    const grid = document.getElementById("jump-grid");
    if(!grid) return;
    grid.innerHTML = "";
    activeSessionQuestions.forEach((q, idx) => {
        const btn = document.createElement("div");
        btn.className = "jump-btn";
        if (idx === currentIdx) btn.classList.add("current");
        if (userAnswers[q.id]) btn.classList.add("answered");
        btn.textContent = idx + 1;
        btn.onclick = () => {
            currentIdx = idx;
            renderQuestion();
        };
        grid.appendChild(btn);
    });
}

function renderQuestion() {
    if(!activeSessionQuestions.length) return;
    const q = activeSessionQuestions[currentIdx];
    
    const numEl = document.getElementById("q-number");
    if(numEl) numEl.textContent = "Question " + (currentIdx + 1) + " of 50 (ID: #" + q.id + ")";
    
    const textEl = document.getElementById("q-text");
    if(textEl) textEl.textContent = q.question;
    
    const optionsContainer = document.getElementById("options-container");
    if(!optionsContainer) return;
    optionsContainer.innerHTML = "";
    
    const expBox = document.getElementById("explanation-box");
    if(expBox) {
        expBox.style.display = "none";
        expBox.innerHTML = "<strong>Explanation:</strong> " + q.explanation;
    }

    const alreadyAnswered = userAnswers[q.id];

    Object.entries(q.options).forEach(([key, text]) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = text;
        
        if (alreadyAnswered) {
            btn.disabled = true;
            if (key === q.answer) btn.classList.add("correct");
            if (key === alreadyAnswered && key !== q.answer) btn.classList.add("wrong");
            if(expBox) expBox.style.display = "block";
        } else {
            btn.onclick = () => selectOption(key);
        }
        optionsContainer.appendChild(btn);
    });

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    if(prevBtn) prevBtn.disabled = currentIdx === 0;
    if(nextBtn) nextBtn.disabled = currentIdx === activeSessionQuestions.length - 1;
    
    updateScorecard();
    buildJumpGrid();
}

function selectOption(selectedKey) {
    const q = activeSessionQuestions[currentIdx];
    userAnswers[q.id] = selectedKey;
    if (selectedKey === q.answer) {
        scoreCorrect++;
    }
    renderQuestion();
}

function nextQuestion() {
    if (currentIdx < activeSessionQuestions.length - 1) {
        currentIdx++;
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
    }
}

function updateScorecard() {
    const answeredCount = Object.keys(userAnswers).length;
    const sc = document.getElementById("score-correct");
    const sa = document.getElementById("score-answered");
    const acc = document.getElementById("score-accuracy");
    
    if(sc) sc.textContent = scoreCorrect;
    if(sa) sa.textContent = answeredCount + " / 50";
    const accuracy = answeredCount > 0 ? Math.round((scoreCorrect / answeredCount) * 100) : 0;
    if(acc) acc.textContent = accuracy + "%";
}

function resetAndShuffle() {
    if(confirm("Generate a fresh random 50-question test session?")) {
        initNewSession();
    }
}

window.onload = function() {
    initNewSession();
};
